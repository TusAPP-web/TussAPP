name: GimAPP preview (Firebase Hosting)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/gimapp-privacidad-eliminacion
    paths:
      - 'apps/gimapp/catalogo/**'
      - 'apps/gimapp/panel/**'
      - 'apps/gimapp/config.js'
      - 'apps/gimapp/index.html'
      - 'apps/gimapp/firebase.json'
      - '.github/workflows/gimapp-preview.yml'

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/857919299458/locations/global/workloadIdentityPools/github-gimapp-preview/providers/github-actions
          service_account: github-gimapp-preview@gimapp-67719.iam.gserviceaccount.com

      - name: Diagnose GitHub OIDC identity (temporary)
        env:
          WIF_AUDIENCE: //iam.googleapis.com/projects/857919299458/locations/global/workloadIdentityPools/github-gimapp-preview/providers/github-actions
        run: |
          node --input-type=module <<'NODE'
          const endpoint = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          endpoint.searchParams.set('audience', process.env.WIF_AUDIENCE);

          const response = await fetch(endpoint, {
            headers: {
              Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`,
            },
          });

          if (!response.ok) {
            throw new Error(`GitHub OIDC request failed: HTTP ${response.status}`);
          }

          const { value: token } = await response.json();
          const claims = JSON.parse(
            Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
          );

          console.log(JSON.stringify({
            iss: claims.iss,
            aud: claims.aud,
            sub: claims.sub,
            repository: claims.repository,
            ref: claims.ref,
          }, null, 2));
          NODE

      - name: Verify Google Cloud access token
        run: gcloud auth print-access-token > /dev/null

      - name: Deploy isolated preview channel
        working-directory: apps/gimapp
        run: npx --yes firebase-tools@15.22.3 hosting:channel:deploy gimapp-feature-preview --project gimapp-67719 --expires 7d --debug
