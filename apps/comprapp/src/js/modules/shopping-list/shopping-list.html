<button class="back-button" type="button" data-back>← Inicio</button>
<section class="shopping-list-page">
  <p class="eyebrow">ORGANIZÁ TUS COMPRAS</p>
  <h1>Lista de compras</h1>
  <p class="intro">Agregá artículos y cantidades. Esta lista se guarda en este dispositivo.</p>

  <form class="shopping-add-form" data-add-form novalidate>
    <label for="shopping-item-name">Artículo</label>
    <input id="shopping-item-name" name="name" type="text" maxlength="100" placeholder="Ej.: leche" required autocomplete="off">
    <div class="shopping-quantity-field">
      <label for="shopping-item-quantity">Cantidad</label>
      <input id="shopping-item-quantity" name="quantity" type="number" min="0.01" step="any" value="1" required inputmode="decimal">
    </div>
    <button class="primary-button" type="submit">Agregar a la lista</button>
    <p class="shopping-form-message" data-form-message role="status" aria-live="polite"></p>
  </form>

  <div class="shopping-list-heading">
    <h2>Artículos</h2>
    <span data-list-count>0 artículos</span>
  </div>
  <div class="shopping-items" data-items aria-live="polite">
    <p class="shopping-loading">Cargando lista…</p>
  </div>
  <p class="shopping-storage-note">Por ahora son artículos manuales: todavía no están vinculados al catálogo maestro ni a comercios. No se guardan en la nube.</p>
</section>
